name: Build

# Manual only: nothing runs by itself. Start it from the repository's Actions tab ("Run workflow"): it runs the checks and engine tests, and builds the installers when
# "Build Windows and macOS installers" is ticked. To run it on every push again, put back the push and pull_request triggers (see the commit history of this file).
on:
  workflow_dispatch:
    inputs:
      installers:
        description: "Build Windows and macOS installers"
        type: boolean
        default: true

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (TypeScript, Rust, Python)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm audit --omit=dev
      - run: npx vite build
      - name: Linux libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m compileall -q analysis/filmcrafter_engine

  film-engine:
    name: Film engine tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # the film workflow needs only these (checked in a clean environment on Windows): story, Bible, shots, making, continuity, hand-off, and a real FFmpeg export
      - run: pip install pytest requests pillow numpy soundfile imageio-ffmpeg pyyaml keyring pypdf fal-client openai opentimelineio otio-cmx3600-adapter
      - run: python -m pytest analysis/tests/test_story.py analysis/tests/test_bible.py analysis/tests/test_shots.py analysis/tests/test_make.py analysis/tests/test_golden_film.py analysis/tests/test_filmcheck.py analysis/tests/test_interchange.py analysis/tests/test_directcmd.py -q

  macos-compile:
    name: macOS compile check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npx vite build
      - name: cargo build (errors published as annotations)
        shell: bash
        run: |
          set +e
          cargo build --manifest-path src-tauri/Cargo.toml 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            grep -E "^(error|warning: unused)" -A8 build.log | head -80 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $code
      - name: Tauri bundle (errors published as annotations)
        shell: bash
        run: |
          set +e
          npx tauri build --bundles app,dmg 2>&1 | tee bundle.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            grep -iE "error|failed" -A4 bundle.log | tail -60 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $code

  engine:
    name: Engine install + analysis (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install PyTorch (CPU on Windows; default wheels on macOS)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          else
            pip install torch==2.6.0 torchaudio==2.6.0
          fi
      - name: Install pinned engine packages (same list the app installs)
        run: pip install -r analysis/requirements-engine.txt
      - name: Tests by type (unit, regression, security, acceptance, integration, end to end)
        working-directory: analysis
        shell: bash
        run: |
          pip install pytest
          fail=0
          for kind in unit regression security acceptance integration e2e; do
            echo "::group::$kind"
            python -m pytest -q -m "$kind" -p no:cacheprovider || fail=1
            echo "::endgroup::"
          done
          exit $fail
      - name: Security scans (code and packages)
        working-directory: analysis
        shell: bash
        run: |
          pip install bandit pip-audit
          python -m bandit -q -r filmcrafter_engine -ll
          python -m pip_audit -r requirements-engine.txt --no-deps --disable-pip
      - name: Imports
        working-directory: analysis
        run: python -c "import librosa, demucs, faster_whisper, openai, fal_client, pypdf, imageio_ffmpeg, PIL, yaml, keyring, filmcrafter_engine.render, filmcrafter_engine.concepts, filmcrafter_engine.command; print('imports ok')"
      - name: "Analyse a generated test song (known answer: 120 BPM, 6 sections)"
        working-directory: analysis
        shell: bash
        run: |
          python make_test_song.py test.wav
          python -m filmcrafter_engine test.wav --out sm.json > /dev/null
          python - <<'EOF'
          import json
          m = json.load(open("sm.json"))
          labels = [s["label"] for s in m["sections"]]
          print("bpm", m["bpm"], labels)
          assert abs(m["bpm"] - 120) < 1, m["bpm"]
          assert labels == ["INTRO", "VERSE", "CHORUS", "VERSE", "CHORUS", "OUTRO"], labels
          EOF

  installers:
    name: Installer (${{ matrix.label }})
    needs: [checks]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.installers)
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: "Windows x64", os: windows-latest, args: "" }
          - { label: "macOS Apple Silicon", os: macos-latest, args: "--target aarch64-apple-darwin" }
          - { label: "macOS Intel", os: macos-latest, args: "--target x86_64-apple-darwin" }
    runs-on: ${{ matrix.os }}
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Import the Windows code-signing certificate (only when the WINDOWS_CERTIFICATE secret exists)
        if: matrix.os == 'windows-latest' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'filmcrafter-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)
          Remove-Item $pfx -Force
          "FILMCRAFTER_SIGN_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FILMCRAFTER_REQUIRE_SIGNING=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional code signing: add these repository secrets when you have the certificates.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'build-__VERSION__' }}
          releaseName: "FilmCrafter __VERSION__"
          releaseBody: "Windows: run the .exe setup. macOS: open the .dmg for your Mac (Apple Silicon or Intel). Unsigned builds show a security warning until code signing is set up."
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
