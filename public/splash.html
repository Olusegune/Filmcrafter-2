<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>FilmCrafter</title>
<style>
  /* One opening for FilmCrafter: the dark stage, the artwork fading in, a film strip rolling past top and bottom, a slow sweep of light.
     Shorter for frequent launches, a still frame with reduced motion. The main window replaces this as soon as it is ready. */
  html, body { margin: 0; height: 100%; background: #05070a; overflow: hidden; cursor: default; user-select: none; }
  .layer { position: absolute; inset: 0; }
  .art { background: #05070a url("splash.jpg") center / cover no-repeat; opacity: 0; transform: scale(1.045); }
  .play .art { animation: art 1100ms cubic-bezier(.2,.8,.2,1) 80ms forwards; }
  .quick .art { animation-duration: 380ms; animation-delay: 0ms; }
  .still .art { opacity: 1; transform: none; }
  @keyframes art { from { opacity: 0; transform: scale(1.045); } to { opacity: 1; transform: none; } }

  /* the film strips: two rows of frames, one rolling left, one rolling right */
  .reel { position: absolute; left: 0; right: 0; height: 34px; overflow: hidden; opacity: 0;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent); mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent); }
  .reel.top { top: 14px; } .reel.bottom { bottom: 22px; }
  .play .reel { animation: fadeto .8s ease-out .5s forwards; } .quick .reel { animation-duration: .3s; animation-delay: .1s; } .still .reel { opacity: .5; }
  @keyframes fadeto { to { opacity: .6; } }
  .track { display: flex; width: max-content; animation: roll 46s linear infinite; }
  .reel.bottom .track { animation-direction: reverse; animation-duration: 58s; }
  .set { display: flex; gap: 8px; padding-right: 8px; }
  .set i { width: 54px; height: 34px; border-radius: 4px; background: linear-gradient(135deg, hsla(var(--h), 40%, 38%, .5), hsla(calc(var(--h) + 40), 50%, 22%, .35));
    box-shadow: inset 0 0 0 1px rgba(244,247,250,.10); }
  @keyframes roll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  /* a slow sweep of warm light across the picture */
  .sweep { position: absolute; top: -10%; bottom: -10%; width: 34%; left: -40%; transform: skewX(-18deg); mix-blend-mode: screen; opacity: 0;
    background: linear-gradient(90deg, transparent, rgba(232,180,92,.16), rgba(140,200,255,.10), transparent); }
  .play .sweep { animation: sweep 2.6s ease-in-out 1.0s 1 forwards; } .quick .sweep { animation-duration: 1.4s; animation-delay: .35s; }
  @keyframes sweep { 0% { left: -40%; opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { left: 120%; opacity: 0; } }

  @media (prefers-reduced-motion: reduce) { .art, .sweep { animation: none !important; } .art { opacity: 1; transform: none; } .track, .reel { animation: none !important; } .reel { opacity: .5; } }

  /* Close and guide buttons, and a hairline that runs down while the splash is up */
  .bar { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: #e8b45c; transform-origin: left; animation: run 4.5s linear forwards; opacity: .75; }
  @keyframes run { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  @media (prefers-reduced-motion: reduce) { .bar { animation: none; transform: scaleX(0); } }
  .x, .guide { position: absolute; z-index: 5; border: 1px solid rgba(244,247,250,.35); background: rgba(5,7,10,.62); color: #f4f7fa; border-radius: 6px; cursor: pointer; font: 600 12.5px/1 "Segoe UI Variable Text", "SF Pro Text", "Segoe UI", -apple-system, sans-serif; }
  .x { top: 12px; right: 12px; width: 34px; height: 34px; font-size: 16px; }
  .guide { right: 14px; bottom: 40px; height: 34px; padding: 0 16px; }
  .x:hover, .guide:hover { background: rgba(232,180,92,.22); border-color: #e8b45c; }
  .x:focus-visible, .guide:focus-visible { outline: 2px solid #64b7ff; outline-offset: 2px; }
</style>
</head>
<body>
<div class="layer art" role="img" aria-label="FilmCrafter. Craft stories into cinema."></div>
<div class="reel top" aria-hidden="true"><div class="track" id="t1"></div></div>
<div class="reel bottom" aria-hidden="true"><div class="track" id="t2"></div></div>
<div class="layer sweep" aria-hidden="true"></div>
<button class="x" id="x" type="button" aria-label="Close this and open the app" title="Close (Esc)">&#x2715;</button>
<button class="guide" id="guide" type="button" title="Open the guide: how FilmCrafter works, with pictures">Open the guide</button>
<div class="bar" aria-hidden="true"></div>
<script>
  // Frequent launches get the short version; reduced motion gets the finished frame.
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches, quick = false;
  try {
    var last = Number(localStorage.getItem("fc-splash-last") || 0);
    quick = Date.now() - last < 3 * 86400000;
    localStorage.setItem("fc-splash-last", String(Date.now()));
  } catch (e) {}
  document.body.className = reduce ? "still" : quick ? "play quick" : "play";
  // the frames of the strips: two identical halves, so the roll loops without a jump
  function fill(id, seed) {
    var html = "";
    for (var k = 0; k < 2; k++) { html += '<div class="set">'; for (var i = 0; i < 24; i++) html += '<i style="--h:' + ((i * 37 + seed) % 360) + '"></i>'; html += "</div>"; }
    document.getElementById(id).innerHTML = html;
  }
  fill("t1", 10); fill("t2", 200);
  // The buttons ask the app to close this window (and, for the guide, to open the documentation). Outside the app they do nothing.
  function closeSplash(guide) {
    try { window.__TAURI_INTERNALS__.invoke("splash_close", { guide: !!guide }); } catch (e) {}
  }
  document.getElementById("x").addEventListener("click", function () { closeSplash(false); });
  document.getElementById("guide").addEventListener("click", function () { closeSplash(true); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSplash(false); });
</script>
</body>
</html>
