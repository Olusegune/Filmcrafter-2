[pytest]
testpaths = tests
markers =
    unit: one function or small module in isolation (no ffmpeg, no real services)
    integration: several parts working together (real ffmpeg, files on disk, a fake provider or local server)
    e2e: a whole user journey from audio file to finished film
    regression: a bug that really happened, kept from coming back
    acceptance: a requirement the product promises, written as a scenario
    security: resistance to hostile input, unsafe paths, leaked secrets and unsafe commands
